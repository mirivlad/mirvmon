name: mirvmon

services:
  app:
    image: "${MIRVMON_IMAGE:-ghcr.io/mirivlad/mirvmon:latest}"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_DEBUG: "0"
      APP_KEY: "${APP_KEY:?Set APP_KEY in Portainer or .env}"
      SETUP_TOKEN: "${SETUP_TOKEN:?Set SETUP_TOKEN in Portainer or .env}"
      APP_TIMEZONE: "${APP_TIMEZONE:-UTC}"
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-}"
      TRUSTED_PROXIES: "${TRUSTED_PROXIES:-private_ranges}"
      SESSION_SECURE: "${SESSION_SECURE:-1}"
      SERVER_NAME: ":8080"
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: "${DB_NAME:-mirvmon}"
      DB_USERNAME: "${DB_USERNAME:-mirvmon}"
      DB_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in Portainer or .env}"
      DB_SSLMODE: disable
      DB_STARTUP_ATTEMPTS: "${DB_STARTUP_ATTEMPTS:-60}"
      OFFLINE_CHECK_INTERVAL: "${OFFLINE_CHECK_INTERVAL:-15}"
      NOTIFICATION_POLL_INTERVAL: "${NOTIFICATION_POLL_INTERVAL:-2}"
      NOTIFICATION_BATCH_SIZE: "${NOTIFICATION_BATCH_SIZE:-20}"
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}:8080"
    expose:
      - "8080"
    # Names the Docker host so a Telegram proxy listening on the host loopback
    # can be reached as host.docker.internal instead of a gateway address that
    # changes whenever the network is recreated.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - app_data:/app/var
    tmpfs:
      - /tmp:mode=1777
      - /config:uid=10001,gid=10001,mode=0700
      - /data:uid=10001,gid=10001,mode=0700
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/readyz"]
      start_period: 15s
      interval: 15s
      timeout: 5s
      retries: 5
    stop_grace_period: 45s
    cpus: "${APP_CPUS:-2.0}"
    mem_limit: "${APP_MEMORY_LIMIT:-512m}"
    pids_limit: 256
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    networks:
      - frontend
      - database

  db:
    image: timescale/timescaledb:2.28.3-pg17@sha256:9372c578c11ea83c56e4a8f7af6ec4156646722d270f5ade79559ccb101161a9
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${DB_NAME:-mirvmon}"
      POSTGRES_USER: "${DB_USERNAME:-mirvmon}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in Portainer or .env}"
      POSTGRES_INITDB_ARGS: "--data-checksums --auth-host=scram-sha-256 --auth-local=scram-sha-256"
      TIMESCALEDB_TELEMETRY: "off"
      TZ: "${APP_TIMEZONE:-UTC}"
    command: ["postgres", "-c", "timescaledb.telemetry_level=off"]
    volumes:
      - db_data:/var/lib/postgresql/data
    tmpfs:
      - /tmp
    shm_size: 256mb
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          head -1 /var/lib/postgresql/data/postmaster.pid | grep -qx 1 &&
          pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      start_period: 15s
      interval: 10s
      timeout: 5s
      retries: 10
    stop_grace_period: 60s
    cpus: "${DB_CPUS:-2.0}"
    mem_limit: "${DB_MEMORY_LIMIT:-2g}"
    pids_limit: 512
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    networks:
      - database

volumes:
  app_data:
  db_data:

networks:
  frontend:
  database:
    internal: true
