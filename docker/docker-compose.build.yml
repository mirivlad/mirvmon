services:
  app:
    image: mirvmon/app:dev
    pull_policy: never
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        HTTP_PROXY: "${HTTP_PROXY:-}"
        HTTPS_PROXY: "${HTTPS_PROXY:-}"
        NO_PROXY: "${NO_PROXY:-localhost,127.0.0.1}"

  db:
    image: timescale/timescaledb:2.28.3-pg17
    pull_policy: missing
