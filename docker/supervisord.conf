[supervisord]
nodaemon=true
pidfile=/tmp/supervisord.pid
logfile=/dev/null
logfile_maxbytes=0
user=app


[program:dr-worker]
command=/app/bin/dr-worker
directory=/app
priority=5
autostart=true
autorestart=unexpected
startsecs=1
startretries=3
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=120
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

[program:web]
command=/usr/local/bin/frankenphp run --config /etc/frankenphp/Caddyfile --adapter caddyfile
directory=/app
priority=10
autostart=true
autorestart=unexpected
startsecs=3
startretries=3
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=40
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

[program:offline-worker]
command=/app/bin/offline-worker
directory=/app
priority=20
autostart=true
autorestart=unexpected
startsecs=1
startretries=3
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=15
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

[program:notification-worker]
command=/app/bin/notification-worker
directory=/app
priority=30
autostart=true
autorestart=unexpected
startsecs=1
startretries=3
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=35
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

[program:website-check-worker]
command=/app/bin/website-check-worker
directory=/app
priority=25
autostart=true
autorestart=unexpected
startsecs=1
startretries=3
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=35
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

[program:audit-retention-worker]
command=/app/bin/audit-retention-worker
directory=/app
priority=40
autostart=true
autorestart=unexpected
startsecs=1
startretries=3
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=15
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
